name: Enervee
description: >-
  Enervee operates an AI-powered white-label marketplace platform that helps
  utilities and government energy programs scale energy efficiency across 39
  million-plus households in North America. Its stack spans a utility-branded
  online store for efficient appliances and equipment across 40-plus product
  categories (HVAC, water heaters, heat pumps, smart thermostats, EV chargers),
  the Enervee Score - a proprietary 0-100 energy-efficiency rating updated daily
  - Eco Financing embedded lending at checkout through national bank partners,
  and Instant Rebates that automatically stack utility, government, and
  manufacturer incentives at checkout. Enervee is a portfolio company of Obvious
  Ventures. No public developer API or documentation surface is currently
  published; this profile captures the company's public security, trust, and
  identity posture for the API Evangelist network.
